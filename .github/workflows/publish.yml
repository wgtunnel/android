name: publish
permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      track:
        type: choice
        description: "Google Play release track"
        options:
          - none
          - internal
          - alpha
          - beta
          - production
        default: none
        required: true
      release_type:
        type: choice
        description: "GitHub release type"
        options:
          - none
          - release
        default: release
        required: true
      tag_name:
        description: "Tag name for release"
        required: false
        default: 1.1.1
  workflow_call:
    inputs:
      flavor:
        type: string
        description: "Product flavor"
        required: false
        default: standalone

jobs:

  build-fdroid:
    if: >-
      ${{ 
        github.event_name == 'push' || 
        inputs.release_type != 'none' 
      }}
    uses: ./.github/workflows/build.yml
    secrets:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
    with:
      build_type: ${{ github.event_name == 'push' && 'release' || inputs.release_type }}
      flavor: fdroid

  build-standalone:
    if: >-
      ${{ 
        github.event_name == 'push' || 
        inputs.release_type != 'none' 
      }}
    uses: ./.github/workflows/build.yml
    secrets:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
    with:
      build_type: ${{ github.event_name == 'push' && 'release' || inputs.release_type }}
      flavor: standalone

  publish-github:
    if: >-
      ${{ 
        github.event_name == 'push' || 
        inputs.release_type != 'none' 
      }}
    needs:
    - build-fdroid
    - build-standalone
    name: publish-github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'master' }}
      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y gh apksigner

      - name: Set latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Automated tag for HEAD commit"
          git push --force origin refs/tags/latest

      - name: Get latest release
        id: latest_release
        uses: kaliber5/action-get-release@v1.0.0
        with:
          token: ${{ github.token }}
          latest: true

      - name: Generate Changelog
        id: changelog
        uses: requarks/changelog-action@v1.11.0
        with:
          token: ${{ github.token }}
          toTag: ${{ steps.latest_release.outputs.tag_name }}
          fromTag: "latest"
          writeToFile: false

      - name: Make download dir
        run: mkdir ${{ github.workspace }}/temp

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: android_artifacts_*
          path: ${{ github.workspace }}/temp
          merge-multiple: true

      - name: Set version release notes
        if: ${{ github.event_name == 'push' || inputs.release_type == 'release' }}
        run: |
          VERSION_CODE=$(sed -nE 's/^versionCode[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          RELEASE_NOTES="$(cat ${{ github.workspace }}/fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt || echo "No changelog found for ${VERSION_CODE}")"
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Get checksum
        id: checksum
        run: |
          file_path=$(find ${{ github.workspace }}/temp -type f -iname "*.apk" | head -n 1)
          if [ -z "$file_path" ]; then
            echo "No APK file found"
            exit 1
          fi
          checksum=$(apksigner verify --print-certs "$file_path" | grep -Po "(?<=SHA-256 digest:) .*" | tr -d "[:blank:]")
          echo "checksum=$checksum" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3.0.4
        with:
          # Must be a PAT because bot creates release
          token: ${{ secrets.PAT }}
          body: |
            ${{ env.RELEASE_NOTES }}

            SHA-256 fingerprints for the 4096-bit signing certificate:
            ```sh
            ${{ steps.checksum.outputs.checksum }}
            ```

            To verify fingerprint:
            ```sh
            apksigner verify --print-certs [path to APK file] | grep SHA-256
            ```

            ### Changelog
            ${{ steps.changelog.outputs.changes }}
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag_name }}
          name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ${{ github.workspace }}/temp/**/*.apk

  publish-fdroid-public:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.release_type != 'none'
      }}
    needs:
      - publish-github
    steps:
      - name: Dispatch update for fdroid repo
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.PAT }}
          repository: wgtunnel/fdroid
          event-type: fdroid-update

  publish-zapstore:
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.release_type != 'none'
      }}
    needs:
      - publish-github
    uses: ./.github/workflows/publish-zapstore.yml
    secrets:
      ZAPSTORE_SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}

  build-google-aab:
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.track != 'none'
      }}
    uses: ./.github/workflows/build-aab.yml
    secrets:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
    with:
      build_type: release
      flavor: google

  publish-play:
    if: ${{ github.event_name == 'push' || inputs.track != 'none' }}
    name: Publish to Google Play
    runs-on: ubuntu-latest
    needs: build-google-aab
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'master' }}
          persist-credentials: false

      - name: Download AAB artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: google-play-aab
          path: ${{ github.workspace }}/aab

      - name: Find exact AAB file path
        id: find-aab
        run: |
          AAB_PATH=$(find "${{ github.workspace }}/aab" -name "*.aab" -type f | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "ERROR: No .aab file found after download!"
            find "${{ github.workspace }}/aab" -type f
            exit 1
          fi
          echo "Found AAB: $AAB_PATH"
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Create service_account.json
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Upload to Google Play
        run: |
          track=${{ github.event_name == 'push' && 'production' || inputs.track }}
          bundle exec fastlane android upload_aab \
            track:"$track" \
            aab:"${{ steps.find-aab.outputs.aab_path }}" \
            json_key:"service_account.json" \
            package_name:"com.zaneschepke.wireguardautotunnel"

  publish-listing:
    # A duplicate version code must not block the store listing. always()
    # lets this run when the binary upload failed; track "none" still skips it.
    if: ${{ always() && (github.event_name == 'push' || inputs.track != 'none') }}
    name: Publish Play Store listing
    needs: publish-play
    uses: ./.github/workflows/publish-play-listing.yml
    secrets:
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}