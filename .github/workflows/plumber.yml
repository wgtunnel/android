name: plumber

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  workflow_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Plumber reads the workflow runs and one run log to prove the
      # token scope of each job.
      actions: read
      # Lists the findings under code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check the workflows with Plumber
        uses: getplumber/plumber@v0.7.23
        with:
          # Pull requests from forks get a read-only token, so the upload
          # to code scanning is skipped there. The report stays a
          # workflow artifact.
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
          # Fail under 85 points instead of on any finding, so one small
          # finding does not block a pull request.
          min-points: 85
