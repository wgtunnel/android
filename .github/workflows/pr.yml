name: on-pr

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

jobs:
  format_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1

      - name: Read JDK version
        id: jdk
        run: |
          JDK_VERSION=$(sed -nE 's/^jdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          echo "version=$JDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ steps.jdk.outputs.version }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check formatting
        run: |
          ./gradlew formatCheck
          echo "Working tree matches ./gradlew format."