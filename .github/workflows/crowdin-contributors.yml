name: crowdin-contributors

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: andrii-bodnar/action-crowdin-contributors@v3.3.1
        env:
          CROWDIN_PROJECT_ID: 911151
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_CI_TOKEN }}
      - uses: peter-evans/create-pull-request@v8.1.3
        with:
          commit-message: 'docs: update Crowdin translators'
          title: 'docs: update Crowdin translators'
