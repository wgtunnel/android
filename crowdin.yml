project_id: 911151
preserve_hierarchy: true

files:
  - source: "/app/src/main/res/values/strings.xml"
    translation: "/app/src/main/res/values-%android_code%/%original_file_name%"
    skip_untranslated_strings: true
    languages_mapping:
      android_code:
        # Spanish
        es-ES: es

        # Indonesian
        id: in

        # Chinese
        zh-CN: zh-rCN
        zh-TW: zh-rTW
        zh-HK: zh-rHK

        # Urdu
        ur-PK: ur
        ur-IN: ur-rIN

        # Portuguese
        pt-BR: pt-rBR
        pt-PT: pt-rPT

        # Other languages
        cs: cs
        de: de
        et: et
        fa: fa
        fi: fi
        fr: fr
        hu: hu
        it: it
        ja: ja
        ka: ka
        ko: ko
        nl: nl
        pl: pl
        ru: ru
        sk: sk
        ta: ta
        tr: tr
        uk: uk
        vi: vi
        eu: eu

    excluded_target_languages:
      - en
      - en-US

  # Folder names must match Play Console listing locales, not Crowdin defaults.
  # https://support.google.com/googleplay/android-developer/table/4419860
  # Quote "no": YAML 1.1 treats `no` as boolean, and Crowdin's Java parser
  # then fails with Boolean cannot be cast to String.
